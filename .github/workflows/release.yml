# Pushing a tag like v0.8.0 tests it, builds both downloads and publishes a release.
#
# The tarball isn't optional: install.sh and install.ps1 look for a .tar.gz on the
# latest release, so a release with only the exe would break them.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: .release/*.tar.gz

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: pip install -r ui/requirements-build.txt
      - run: python ui/tests/test_app.py
      - run: ./ui/build_exe.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: .release/exe/gemini-code.exe

  publish:
    needs: [tarball, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" gemini-code.exe *.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
